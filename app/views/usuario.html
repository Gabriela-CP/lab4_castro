<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplicación de Usuario</title>
  <link rel="stylesheet" href="../../recursos/bootstrap.min.css" />
  <link rel="stylesheet" href="../../recursos/sweetalert2.min.css" />
  <link rel="stylesheet" href="../../recursos/inter-font.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 2rem 1rem;
    }

    .form-wrapper {
      width: 100%;
      max-width: 480px;
    }

    /* Encabezado superior */
    .form-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-brand .brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
    }

    .form-brand .brand-icon svg {
      width: 32px;
      height: 32px;
      fill: #fff;
    }

    .form-brand h1 {
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.25rem;
      letter-spacing: -0.02em;
    }

    .form-brand p {
      color: rgba(255,255,255,0.5);
      font-size: 0.875rem;
      margin: 0;
      font-weight: 400;
    }

    /* Tarjeta */
    .form-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
    }

    /* Labels */
    .form-label {
      color: rgba(255,255,255,0.75);
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    /* Inputs */
    .form-control {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9375rem;
      font-weight: 400;
      padding: 0.75rem 1rem;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .form-control::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .form-control:focus {
      background: rgba(255,255,255,0.1);
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25);
      color: #fff;
      outline: none;
    }

    .form-control.is-invalid {
      border-color: #f87171;
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.2);
    }

    .form-control.is-valid {
      border-color: #34d399;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2);
    }

    /* Input group (sueldo) */
    .input-group .input-group-text {
      background: rgba(79, 70, 229, 0.2);
      border: 1px solid rgba(255,255,255,0.12);
      border-right: none;
      border-radius: 10px 0 0 10px;
      color: #a5b4fc;
      font-weight: 600;
      font-size: 0.9375rem;
      padding: 0.75rem 1rem;
    }

    .input-group .form-control {
      border-left: none;
      border-radius: 0 10px 10px 0;
    }

    .input-group .form-control:focus {
      border-left: none;
    }

    /* Feedback */
    .invalid-feedback, .field-error {
      color: #f87171;
      font-size: 0.78rem;
      margin-top: 0.4rem;
      font-weight: 400;
    }

    /* Separador */
    .form-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 1.75rem 0;
    }

    /* Botón */
    .btn-procesar {
      width: 100%;
      padding: 0.875rem;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.45);
      position: relative;
      overflow: hidden;
    }

    .btn-procesar:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(79, 70, 229, 0.55);
    }

    .btn-procesar:active {
      transform: translateY(0);
      opacity: 1;
    }

    .btn-procesar .btn-icon {
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    /* Número de campo */
    .field-step {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      background: rgba(79, 70, 229, 0.3);
      border-radius: 50%;
      font-size: 0.65rem;
      font-weight: 700;
      color: #a5b4fc;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <div class="form-wrapper">

    <!-- Marca / encabezado -->
    <div class="form-brand">
      <div class="brand-icon">
        <!-- Ícono persona -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
      <h1>Aplicación de Empleo</h1>
      <p>Complete el formulario para procesar su solicitud</p>
    </div>

    <!-- Tarjeta del formulario -->
    <div class="form-card">
      <form id="formUsuario" novalidate autocomplete="off">

        <!-- Nombre Completo -->
        <div class="mb-4">
          <label for="nombreCompleto" class="form-label">
            <span class="field-step">1</span>Nombre Completo
          </label>
          <input
            type="text"
            class="form-control"
            id="nombreCompleto"
            placeholder="Ej. Juan Pérez García"
            required
          />
          <div class="invalid-feedback">Ingrese su nombre completo.</div>
        </div>

        <!-- Edad -->
        <div class="mb-4">
          <label for="edad" class="form-label">
            <span class="field-step">2</span>Edad
          </label>
          <input
            type="number"
            class="form-control"
            id="edad"
            placeholder="Ej. 25"
            min="18"
            max="99"
            required
          />
          <div class="invalid-feedback">Ingrese una edad válida entre 18 y 99 años.</div>
        </div>

        <!-- Sueldo Pretendido -->
        <div class="mb-4">
          <label for="sueldoPretendido" class="form-label">
            <span class="field-step">3</span>Sueldo Pretendido
          </label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input
              type="number"
              class="form-control"
              id="sueldoPretendido"
              placeholder="0.00"
              min="0"
              step="0.01"
              required
            />
          </div>
          <div class="field-error" id="sueldoError"></div>
        </div>

        <hr class="form-divider" />

        <!-- Botón -->
        <button type="submit" class="btn-procesar" id="btnProcesar">
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          Procesar Aplicación
        </button>

      </form>
    </div>

  </div>

  <script src="../../recursos/bootstrap.bundle.min.js"></script>
  <script src="../../recursos/sweetalert2.min.js"></script>
  <script src="../controlles/usuario.js"></script>
</body>
</html>
